services:
  - type: web
    name: musicplayer-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CATEGORY_CACHE_TTL_HOURS
        value: "12"
      - key: SEARCH_CACHE_TTL_MINUTES
        value: "60"
      - key: TRENDING_REGION
        value: "IN"
      - key: TRENDING_CACHE_TTL_HOURS
        value: "6"
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
